# Release builds: `goreleaser release --clean` on a tagged commit.
# Package-manager publishing (winget, Scoop, Homebrew) needs the GitHub
# owner and tap/bucket repositories filled in before it can be enabled.
version: 2
project_name: grove

builds:
  - env: [CGO_ENABLED=0]
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
